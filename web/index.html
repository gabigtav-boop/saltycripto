*{box-sizing:border-box}html{background:var(--bg);overflow-x:clip}html,body{margin:0}

*{scrollbar-width:thin;scrollbar-color:var(--ln2) transparent}::selection{background:rgba(255,200,87,.3)}

.pchip{position:absolute;right:76px;top:6px;white-space:nowrap;max-width:calc(100% - 96px);overflow:hidden;z-index:3;display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--s2);border:1px solid var(--ln2);font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}

.nav button{position:relative;padding:10px 14px;color:var(--ink2);font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;transition:color .2s}

.hr{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.pillst{display:flex;align-items:center;gap:8px;height:30px;padding:0 11px;border:1px solid var(--ln);font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--ink2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}.dot.on{background:var(--up);box-shadow:0 0 9px var(--up)}.dot.bad{background:var(--dn);box-shadow:0 0 9px var(--dn)}
.ib{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--ln);color:var(--mut);transition:color .15s,border-color .15s}.ib:hover{color:var(--ink);border-color:var(--ln2)}.ib svg{width:15px;height:15px}

.tp[aria-pressed=true]{border-color:var(--ac);background:var(--acb)}.tp b{font:600 12.5px var(--sans)}
.ci{display:inline-grid;place-items:center;flex:none;width:var(--s,20px);height:var(--s,20px);border-radius:50%;font:700 calc(var(--s,20px)*.46)/1 var(--sans);color:#02070a;background:var(--c)}
main{max-width:1600px;margin:0 auto;padding:var(--gap) var(--pad) 56px;counter-reset:sec}
/* ---------- paneles (HUD) ---------- */
.sec{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:28px 0 2px;padding-bottom:12px;border-bottom:1px solid var(--ln);font:620 21px/1.1 var(--sans);letter-spacing:-.03em;color:var(--ink)}
.sec:before{counter-increment:sec;content:counter(sec,decimal-leading-zero);font:700 11px/1 var(--mono);letter-spacing:.24em;color:var(--ac)}.sec:first-child{margin-top:2px}.sec small{margin-left:auto;font:400 13px var(--sans);letter-spacing:0;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}.c12{grid-column:span 12}.c9{grid-column:span 9}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card,.hud{position:relative;background:var(--card);border:1px solid var(--ln);box-shadow:var(--sh);min-width:0}.card{display:flex;flex-direction:column;animation:rev .5s cubic-bezier(.2,.7,.2,1) both}.hud{padding:16px 18px}
@keyframes rev{from{opacity:0;transform:translateY(8px)}}

.msg.t-pos{border-left-color:var(--up)}.msg.t-wa{border-left-color:var(--wa);color:var(--notx)}.msg.t-ND{border-left-color:var(--steel)}
.seg{display:inline-flex;gap:2px;border:1px solid var(--ln);padding:2px}.seg button{padding:5px 10px;font:600 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--mut);transition:color .15s}.seg button:hover{color:var(--ink)}.seg button[aria-pressed=true]{background:var(--ac);color:var(--on)}

td{padding:10px 12px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap;font:500 12.5px var(--mono)}tbody tr:last-child td{border-bottom:0}tr.cl{cursor:pointer;transition:background .12s}tr.cl:hover{background:var(--hov)}tr.cl:hover td:first-child{box-shadow:inset 2px 0 0 var(--ac)}
.fu{animation:fu .8s}.fd{animation:fd .8s}@keyframes fu{0%{color:var(--up)}}@keyframes fd{0%{color:var(--dn)}}
.bar{position:relative;height:5px;background:var(--s3);overflow:hidden}.bar i{position:absolute;top:0;bottom:0}
.dv{position:relative;height:5px;background:var(--s3)}.dv:before{content:"";position:absolute;left:50%;top:-3px;width:1px;height:11px;background:var(--mut)}.dv i{position:absolute;top:0;height:100%}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--ln);font-size:13px}.kv:last-child{border:0}.kv span{color:var(--mut)}.kv b{font:600 12.5px var(--mono);text-align:right}
.pill{display:inline-block;padding:2px 8px;border:1px solid var(--ln);font:500 11px var(--sans);background:var(--ionb);color:var(--ink2);margin:2px 4px 2px 0}.pill.y{color:var(--up);background:var(--upb);border-color:var(--bup)}.pill.w{color:var(--wa);background:var(--wab);border-color:var(--bwa)}
.empty{padding:26px 18px;text-align:center;color:var(--dim);font-size:13px}.note{margin-top:10px;padding:9px 12px;border:1px solid var(--bwa);background:var(--wab);color:var(--notx);font-size:12.5px}

/* ---------- mercado ---------- */
.pts{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:16px}
.pt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:13px;color:var(--ink2)}.pt i{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--ln2);font:700 11px var(--mono);font-style:normal}.pt b{color:var(--ink)}

.lnk{background:none;border:0;padding:0;color:var(--acx);font:inherit;cursor:pointer;text-decoration:underline}
.kpi{padding:15px 18px}.kpi .v{font:620 clamp(21px,1.9vw,27px)/1.1 var(--sans);letter-spacing:-.03em;margin-top:8px}.kpi .s{font:500 12px var(--mono);margin-top:4px}
.gauge{display:flex;flex-direction:column;align-items:center}.cmp{display:grid;grid-template-columns:1fr 64px 88px;gap:10px;align-items:center;padding:3px 0;font-size:12.5px;color:var(--mut)}.cmp b{font:500 11.5px var(--mono);text-align:right}
.sp{display:block;width:96px;height:26px;margin-left:auto}
.nr{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:9px 18px;border-top:1px solid var(--ln);font-size:13px}.nr .tm{font:500 11px var(--mono);color:var(--dim)}.nr .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ev{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:9px 18px;border-top:1px solid var(--ln);font-size:13px}.ev .w{font:500 11.5px var(--mono)}

#chart{height:560px;position:relative;margin:8px 4px 4px;contain:size}.chartcard #chart{flex:1;height:auto;min-height:clamp(400px,50vh,520px)}
@media(min-width:1181px){.chartcard,.e3{--eh:clamp(520px,66vh,680px);height:var(--eh);min-height:0}.chartcard #chart{min-height:0}.e3 .cb{flex:1;min-height:0;overflow-y:auto}}

details.more{margin-top:12px}details.more summary{cursor:pointer;font:600 10.5px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);list-style:none}details.more summary:before{content:"▸ ";color:var(--ac)}details.more[open] summary:before{content:"▾ "}.leg{position:absolute;left:12px;top:6px;z-index:3;font:500 11px var(--mono);color:var(--mut);pointer-events:none;display:flex;gap:12px}
.fdir{font:620 28px/1.1 var(--sans);letter-spacing:-.03em}.e3 .fdir{font-size:23px}.e3 .rng .rv{font-size:18px}.meter{position:relative;height:6px;background:linear-gradient(90deg,var(--dn),var(--mid) 45%,var(--mid) 55%,var(--up));margin:16px 0 6px}.meter i{position:absolute;top:-5px;width:14px;height:16px;background:var(--knob);transition:left .6s cubic-bezier(.2,.8,.2,1);border:3px solid var(--s1);transform:translateX(-7px);box-shadow:0 0 0 1px var(--ln2)}
.ml{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--dim)}
.box{padding:10px 12px;border:1px solid var(--ln);border-left:2px solid var(--steel);background:var(--s2);margin-top:10px;font-size:13px}.box b{font-family:var(--mono)}
.fx{display:grid;grid-template-columns:1fr 92px 46px;gap:10px;align-items:center;padding:4px 0;font-size:12.5px;color:var(--mut)}.fx b{font:500 11.5px var(--mono);text-align:right}
.lad{display:grid;gap:8px}.lr{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--ln);border-left-width:2px;background:var(--s2)}.lr .lb{font:700 10.5px var(--mono);letter-spacing:.14em}.lr.x{border-left-color:var(--dn)}.lr.e{border-left-color:var(--up)}.lr.x .lb{color:var(--dn)}.lr.e .lb{color:var(--up)}.lr.now{background:transparent;border:1px dashed var(--ln2)}.lr .lp{font:600 16px var(--mono);letter-spacing:-.01em}.lr .ls{font-size:12px;margin-top:1px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr .rt{text-align:right;font:600 13.5px var(--mono)}

    if(!reduce&&grupos.length&&now>proxO){proxO=now+4200;st.coins.forEach((co,g)=>{if((co.objetivo||0)>0&&anc.R[g])paq.push({t:now,dur:2200,g,k:'gold',out:true})})}

  /* cadencia: 60 fps mientras algo se desplaza deprisa (onda de un precio, paquetes, cursor, muelles sin asentar); 30 fps con
