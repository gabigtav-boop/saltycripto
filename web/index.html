const ZG_STEP=.05; /* malla de la calibración: excursiones de 0 a 5 volatilidades cada .05 */
function surv(F,z){const x=z/ZG_STEP,i=Math.floor(x);return i<0?F[0]:i>=F.length-1?F[F.length-1]:F[i]+(F[i+1]-F[i])*(x-i)}
/* Reescala la proyección guardada al precio en vivo: el abanico no tiene deriva, así que se multiplica por el cociente de precios; la
   probabilidad de llegar a cada nivel se recalcula con las curvas de supervivencia guardadas (el nivel no se mueve, el precio sí). */
function escP(pr,f,price){if(!pr)return pr;const o=Object.assign({},pr);o.centro=pr.centro*f;o.b50=pr.b50.map(v=>v*f);o.b80=pr.b80.map(v=>v*f);if(pr.q){o.q={};for(const k in pr.q)o.q[k]=pr.q[k].map(v=>v*f)}
  if(pr.niveles&&pr.F_up&&pr.F_dn&&price>0&&pr.sd_pct>0){const sd=pr.sd_pct/100;o.niveles=pr.niveles.map(g=>{const sube=g.lado==='sube',b=g.borde,p=(sube?price>=b:price<=b)?1:surv(sube?pr.F_up:pr.F_dn,Math.abs(Math.log(b/price))/sd);return Object.assign({},g,{pct:(g.precio/price-1)*100,p})})}
  return o}
function vivoEstatico(){{const nw=Date.now(),ult=WSST.n.length?WSST.n[WSST.n.length-1]:0;if(WSST.conectado&&KW&&nw-WSOPEN>15000&&nw-ult>15000){try{KW.close()}catch(e){}}}
  const s=SEL,o=DATA[s];if(VIEW==='TRADE'&&o&&o.price){const m=MON[s];if(m&&m.p0){const f=o.price/m.p0,out={};for(const tf in m.proy)out[tf]=escP(m.proy[tf],f,o.price);o.proy=out}
    if(WSST.conectado&&(TR.length||BK.a.size)){const mi=microJS(s);if(mi)o.micro=mi}}
  const lat=WSST.lat.slice().sort((a,b)=>a-b);SALUD=Object.assign({},NUBE&&NUBE.salud,{ws:{conectado:WSST.conectado,msg_s:WSST.n.length/10,latencia_ms:lat.length?Math.round(lat[lat.length>>1]):null}});
  LASTT=WSST.conectado?Date.now():0;renderAll(false)}
/* al tocar una moneda se empieza a descargar su archivo antes de que termine el toque (la vista cambia sin esperar) */
if(window.ESTATICO)document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-s]');if(b&&COINS[b.dataset.s])moneda(b.dataset.s).catch(()=>{})},{passive:true});
if(window.ESTATICO){setInterval(vivoEstatico,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){poll();if(!KW)krakenWS()}})}

/* ---------- arranque ---------- */
document.querySelectorAll('#tabs button,#tabbar button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===VIEW));document.body.dataset.v=VIEW;stream();poll();
